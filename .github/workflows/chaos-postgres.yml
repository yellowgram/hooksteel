name: chaos-postgres

on:
  push:
  pull_request:

jobs:
  chaos:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hooksteel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hooksteel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hooksteel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run migrate
      - run: npm run demo:60s
      - run: npm run typecheck
      - run: npm test
