  2. Apply every design_updates[] item with apply: required into DESIGN_STRIPE_PATH.md §1.
     Replace the named target_section. Do not paraphrase.
  3. NQ1–NQ3 are closed at recommended answers (see founder_decisions_locked).
     Merge them. Do not wait for a separate founder thread unless founder
