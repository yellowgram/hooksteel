iterations:
  - id: 1
    expert: distributed_systems_outbox
    attack_thesis: >
      Cycle-1 locked SKIP LOCKED + completed_at then hand-waved lease TTL.
      Dead worker leaves rows invisible. attempts timing unspecified.
      Replay had a name and no mutation. Parent status values never written.
    findings:
      - {id: I1-P0-lease-reclaim, severity: P0, accepted: true, update: DU-ddl-lease}
      - {id: I1-P0-attempts-accounting, severity: P0, accepted: true, update: DU-attempts-backoff}
      - {id: I1-P0-replay-mutation, severity: P0, accepted: true, update: DU-dead-letter-and-replay}
      - {id: I1-P1-parent-status-machine, severity: P1, accepted: true, update: DU-ddl-status-ignored}
      - {id: I1-P1-backoff-formula, severity: P1, accepted: true, update: DU-attempts-backoff}
      - {id: I1-P1-txn-rollback-on-abort, severity: P1, accepted: true, update: DU-handler-http-raw-body}
      - {id: I1-P1-claim-batch, severity: P1, accepted: true, update: DU-attempts-backoff}
      - {id: I1-P2-indexes, severity: P2, accepted: true, update: DU-ddl-lease}
    rejected:
      - SERIALIZABLE isolation
      - LISTEN/NOTIFY required in v0.1
      - lease_expires_at column mandatory
      - write billing_events.failed on first adapter throw

  - id: 2
    expert: stripe_contract_and_security
    attack_thesis: >
      Advertised App Router route never locked request.text().
      sk_ required for a whsec-only path. Unmapped types unspecified.
      Checked-in signatures rot under constructEvent tolerance.
    findings:
      - {id: I2-P0-raw-body-next, severity: P0, accepted: true, update: DU-handler-http-raw-body}
      - {id: I2-P0-verify-dependency, severity: P0, accepted: true, update: DU-verify-and-livemode}
      - {id: I2-P0-livemode-source, severity: P0, accepted: true, update: DU-verify-and-livemode}
      - {id: I2-P1-placeholder-secret, severity: P1, accepted: true, update: DU-verify-and-livemode}
      - {id: I2-P1-event-map-empty, severity: P1, accepted: true, update: DU-adapter-map-and-payload}
      - {id: I2-P1-fixture-signatures, severity: P1, accepted: true, update: DU-chaos-proofs}
      - {id: I2-P1-payload-shape, severity: P1, accepted: true, update: DU-adapter-map-and-payload}
      - {id: I2-P1-pii-retention, severity: P1, accepted: true, update: DU-pii-connect-timeout-docs}
      - {id: I2-P2-connect, severity: P2, accepted: true, update: DU-pii-connect-timeout-docs}
      - {id: I2-P2-timeout-budget, severity: P2, accepted: true, update: DU-pii-connect-timeout-docs}
    rejected:
      - Hand-rolled HMAC
      - Require sk_ in webhook process
      - Drop unmapped events
      - Redacted payloads only in v0.1
      - PCI opinion that outbox equals billing correctness

  - id: 3
    expert: kit_ship_and_support_load
    attack_thesis: >
      Chaos #2 cannot fail. Chaos #5 can be faked in RAM.
      migrate.ts bricks second run. In-root Next implies the kit is a Next app.
      STATUS.md already says design done.
    findings:
      - {id: I3-P0-chaos5-durable-log, severity: P0, accepted: true, update: DU-chaos-proofs}
      - {id: I3-P0-chaos2-substance, severity: P0, accepted: true, update: DU-chaos-proofs}
      - {id: I3-P0-migrate-versioning, severity: P0, accepted: true, update: DU-migrate}
      - {id: I3-P1-chaos-not-in-prod-graph, severity: P1, accepted: true, update: DU-layout}
      - {id: I3-P1-framework-agnostic-readme, severity: P1, accepted: true, update: DU-layout}
      - {id: I3-P1-license-org-definition, severity: P1, accepted: true, update: DU-pii-connect-timeout-docs}
      - {id: I3-P1-ci-shape, severity: P1, accepted: true, update: DU-ci}
      - {id: I3-P1-example-route-location, severity: P1, accepted: true, update: DU-layout}
      - {id: I3-P1-status-doc-honesty, severity: P1, accepted: true, update: DU-status}
      - {id: I3-P2-hookdeck-pointer-is-outline-only, severity: P2, accepted: true, update: DU-pii-connect-timeout-docs}
    rejected:
